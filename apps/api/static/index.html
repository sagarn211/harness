<!doctype html>
<html lang="en" class="bg-slate-950"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snippet Explainer</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-7xl p-6"><header class="mb-6"><h1 class="text-2xl font-bold">Code Snippet Explainer</h1><p class="text-sm text-slate-400">Human approval bound to the exact generated output.</p></header><div class="grid gap-6 lg:grid-cols-2">
<section class="rounded-lg border border-slate-700 bg-slate-900 p-4"><label class="mb-2 block text-sm font-medium">Code snippet</label><textarea id="code" class="h-96 w-full rounded bg-slate-950 p-3 font-mono text-sm ring-1 ring-slate-700" placeholder="Paste code here"></textarea><button onclick="analyze()" class="mt-4 rounded bg-emerald-600 px-4 py-2 font-semibold hover:bg-emerald-500">Analyze Code</button></section>
<section class="space-y-4 rounded-lg border border-slate-700 bg-slate-900 p-4"><div id="statuses" class="flex flex-wrap gap-2"></div><div><h2 class="font-semibold">Detected Language</h2><p id="language" class="text-slate-300">—</p></div><div><h2 class="font-semibold">Explanation</h2><p id="explanation" class="whitespace-pre-wrap text-slate-300">—</p></div><div><h2 class="font-semibold">Documentation</h2><pre class="mt-1 overflow-auto rounded bg-slate-950 p-3"><code id="documentation">—</code></pre></div>
<div id="review" class="hidden border-t border-slate-700 pt-4"><h2 class="mb-2 font-semibold">Review</h2><input id="approver" class="w-full rounded bg-slate-950 p-2 ring-1 ring-slate-700" value="reviewer" placeholder="Approver ID"><div class="mt-3 flex flex-wrap gap-2"><button onclick="review('approve')" class="rounded bg-emerald-600 px-3 py-2">Approve</button><button onclick="toggleEdits()" class="rounded bg-amber-600 px-3 py-2">Edit &amp; Approve</button><button onclick="review('reject')" class="rounded bg-rose-700 px-3 py-2">Reject</button></div><div id="edits" class="mt-3 hidden space-y-2"><textarea id="editExplanation" class="w-full rounded bg-slate-950 p-2" placeholder="Edited explanation"></textarea><textarea id="editDocumentation" class="w-full rounded bg-slate-950 p-2" placeholder="Edited documentation"></textarea><button onclick="review('approve', true)" class="rounded bg-amber-600 px-3 py-2">Submit Edited Approval</button></div></div>
<div id="formatted" class="hidden border-t border-slate-700 pt-4"><h2 class="font-semibold">Formatted Markdown</h2><pre id="markdown" class="mt-1 overflow-auto rounded bg-slate-950 p-3 text-sm"></pre><button onclick="navigator.clipboard.writeText(document.getElementById('markdown').textContent)" class="mt-2 rounded bg-slate-700 px-3 py-2">Copy to Clipboard</button></div>
<details class="border-t border-slate-700 pt-4"><summary class="cursor-pointer font-semibold">Audit Trail</summary><p id="chain" class="mt-2 text-sm"></p><ol id="events" class="mt-2 list-decimal pl-5 font-mono text-xs text-slate-300"></ol></details><p id="message" class="text-sm text-amber-300"></p></section></div></main>
<script>let id=null,data=null;const $=x=>document.getElementById(x);function statuses(s={}){$('statuses').innerHTML=['detected','explained','approved','delivered'].map(k=>`<span class="rounded px-2 py-1 text-xs font-bold ${s[k]?'bg-emerald-700':'bg-slate-700'}">${k.toUpperCase()}</span>`).join('')}function render(d){data=d;$('language').textContent=d.proposal?.language?.name||'—';$('explanation').textContent=d.proposal?.explanation||'—';$('documentation').textContent=d.proposal?.documentation||'—';$('review').classList.toggle('hidden',d.state!=='awaiting_review');$('events').innerHTML=(d.events||[]).map(e=>`<li>${e.seq}: ${e.state}</li>`).join('');let f=d.final_result;statuses(f?.four_statuses||{});$('chain').textContent=f?`Chain Verified: ${f.event_chain_verified?'TRUE':'FALSE'}`:'Chain Verified: —';if(f){$('formatted').classList.remove('hidden');$('markdown').textContent=f.formatted_markdown}}async function call(url,opts={}){let r=await fetch(url,opts),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||'Request failed');return j}async function analyze(){try{let code=$('code').value;let d=await call('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,source_id:'browser-snippet'})});id=d.request_id;render(d);$('message').textContent='Awaiting human review.'}catch(e){$('message').textContent=e.message}}function toggleEdits(){$('edits').classList.toggle('hidden');$('editExplanation').value=data?.proposal?.explanation||'';$('editDocumentation').value=data?.proposal?.documentation||''}async function review(decision,edited=false){try{let b={approver_id:$('approver').value,decision};if(edited){b.edited_explanation=$('editExplanation').value;b.edited_documentation=$('editDocumentation').value}let d=await call(`/api/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});render(d);if(decision==='approve'){await call(`/api/${id}/format`,{method:'POST'});render(await call(`/api/${id}`))}$('message').textContent='Review complete.'}catch(e){$('message').textContent=e.message}}</script></body></html>
